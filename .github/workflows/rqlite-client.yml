name: rqlite client
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
      - if: runner.os == 'Linux'
        run: docker compose -p cubs-rqlite-test -f docker/docker-compose.rqlite-test.yml up -d
      - if: runner.os == 'Linux'
        run: |
          npx rqlite migrate --environment test
          npx rqlite migrate --environment foreignKeys
          npx rqlite check --database --environment test
          npx rqlite check --database --environment foreignKeys
          node --import tsx scripts/validation/rqlite-schema-test.ts 18012
          node --import tsx scripts/validation/rqlite-schema-test.ts 18014
          npm run rqlite:test:cubs
      - if: runner.os == 'Linux'
        run: |
          docker build -t cubs-backend:rqlite-validation .
          node scripts/validation/rqlite-container-test.mjs
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rqlite-validation
          path: artifacts/rqlite-validation
          if-no-files-found: ignore
      - if: always() && runner.os == 'Linux'
        run: docker compose -p cubs-rqlite-test -f docker/docker-compose.rqlite-test.yml down
