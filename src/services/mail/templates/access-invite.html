<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convite para o Cub's</title></head>
<body style="margin:0;background:#f6f5fa;color:#27232f;font-family:Arial,Helvetica,sans-serif">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:36px 16px"><tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border:1px solid #e8e5ef;border-radius:16px">
      <tr><td style="padding:36px 32px 12px;color:#7c3aed;font-size:26px;font-weight:800">Cub's<span style="color:#b5aec0">.</span></td></tr>
      <tr><td style="padding:12px 32px 32px">
        <p style="font-size:14px;color:#746c80;margin:0 0 12px">CONVITE PARA {{scope_type}}</p>
        <h1 style="font-size:28px;line-height:1.2;margin:0 0 20px">{{author_name}} convidou você.</h1>
        <p style="font-size:16px;line-height:1.6">Aceite o convite para entrar em <strong>{{scope_name}}</strong> com a role <strong>{{role_name}}</strong>.</p>
        <p style="margin:28px 0"><a href="{{invite_url}}" style="display:inline-block;padding:14px 22px;background:#7c3aed;border-radius:8px;color:#fff;text-decoration:none;font-weight:700">Revisar e aceitar convite →</a></p>
        <p style="font-size:13px;color:#746c80;line-height:1.6;margin-bottom:0">Este convite foi enviado para {{recipient_email}}. {{expiry_text}}</p>
      </td></tr>
    </table>
  </td></tr></table>
</body></html>
