# PROD: frontend (nginx :80) + backend (:3000) + rqlite (SÓ rede interna).
#
# Pré-requisitos:
#   1. cubs-frontend clonado AO LADO do cubs-backend (contexts relativos abaixo).
#   2. Copiar os templates e preencher:
#        docker/backend.prod.env.example -> docker/backend.prod.env
#        docker/rqlite.prod.env.example  -> docker/rqlite.prod.env
#   3. Subir pelo script, que prepara credenciais e preserva o volume:
#        bash scripts/deploy-prod.sh --bootstrap-auth all  # primeira ativação
#        bash scripts/deploy-prod.sh backend              # atualizações
#
# Segurança: o rqlite NÃO publica porta nenhuma. Backend e conector
# cloudflared o alcançam pela rede interna (http://rqlite:4001). O acesso
# remoto usa HTTPS no Tunnel e Basic Auth no banco; ver docs/RQLITE_DEPLOY.md.
# Complementa o bind restrito do dev (ver docker-compose.dev.yml).
services:
  rqlite:
    build:
      context: ./rqlite
    container_name: cubs-rqlite
    environment:
      NODE_ID: ${NODE_ID:-1}
      RQLITE_ADVERTISE_IP: ${RQLITE_ADVERTISE_IP:-}
      RQLITE_HTTP_ADVERTISE_PORT: ${RQLITE_HTTP_ADVERTISE_PORT:-4001}
      JOIN_NODE: ${JOIN_NODE:-}
      RQLITE_HTTP_ALLOW_ORIGIN: ${RQLITE_HTTP_ALLOW_ORIGIN:-}
      RQLITE_AUTH_FILE: /run/secrets/rqlite_auth
    secrets:
      - rqlite_auth
      - rqlite_health
    volumes:
      - rqlite_data:/rqlite/file
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--config", "/run/secrets/rqlite_health", "http://127.0.0.1:4001/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ..
    container_name: cubs-backend
    env_file: ./backend.prod.env
    environment:
      DATABASE_USERNAME: ${RQLITE_USERNAME:?Run scripts/deploy-prod.sh to configure credentials}
      DATABASE_PASSWORD: ${RQLITE_PASSWORD:?Run scripts/deploy-prod.sh to configure credentials}
    expose:
      - "3000"
    depends_on:
      rqlite:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ../../cubs-frontend
      args:
        # O browser chama a API pelo subdomínio dedicado; o Socket.IO usa a
        # origem desse mesmo valor e continua no servidor HTTP da API.
        VITE_CUBS_API_URL: https://api.cubsonline.com.br/api/v1
    container_name: cubs-frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  # Cloudflare Tunnel mantém somente conexões de saída da máquina. O perfil
  # edge é ativado após criar o túnel remoto e preencher cloudflare.prod.env.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
    container_name: cubs-cloudflared
    profiles: ["edge"]
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - path: ./cloudflare.prod.env
        required: false
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  rqlite_data:

secrets:
  rqlite_auth:
    file: ./.generated/rqlite-auth.json
  rqlite_health:
    file: ./.generated/rqlite-health.curl
