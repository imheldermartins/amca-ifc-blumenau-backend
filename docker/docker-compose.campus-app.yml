# Full local application. Use with origin + origin overlay in Blumenau,
# or with the standalone peer YAML in Videira / Rio do Sul.
services:
  backend:
    build:
      context: ..
    env_file: ${CAMPUS_BACKEND_ENV:?Protected complete backend env file}
    environment:
      NODE_ENV: production
      DATABASE_URL: http://rqlite:4001
      DATABASE_USERNAME: ${RQLITE_USERNAME:?}
      DATABASE_PASSWORD: ${RQLITE_PASSWORD:?}
      APP_PUBLIC_URL: https://${CLUSTER_PUBLIC_HOST:?}
      CORS_ORIGINS: https://${CLUSTER_PUBLIC_HOST:?}
      TRUST_PROXY: "1"
      CUBS_CLUSTER_ENABLED: "true"
      CLUSTER_REDIS_SENTINELS: ${CLUSTER_REDIS_SENTINELS:?Three private IPv4:26379 endpoints}
      CLUSTER_REDIS_PASSWORD_FILE: /run/secrets/cluster_redis
    secrets: [cluster_redis]
    expose: ["3000"]
    depends_on:
      rqlite:
        condition: service_healthy
      coordination:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../../cubs-frontend
      args:
        VITE_CUBS_API_URL: https://${CLUSTER_PUBLIC_HOST:?}/api/v1
    environment:
      CAMPUS_PUBLIC_HOST: ${CLUSTER_PUBLIC_HOST:?}
      NGINX_ENVSUBST_FILTER: ^CAMPUS_PUBLIC_HOST$
    volumes:
      - ./nginx/campus.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose: ["80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
    profiles: ["edge"]
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: ${CAMPUS_TUNNEL_ENV:?Protected token file for this campus tunnel}
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped
