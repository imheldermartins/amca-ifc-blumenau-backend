# Merge with this campus's existing origin OR peer stack, never both.
services:
  coordination:
    image: valkey/valkey:8.1.3@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    entrypoint: ["/bin/sh", "/campus-coordination.sh"]
    environment:
      COORDINATION_MODE: data
      CLUSTER_MESH_IP: ${CLUSTER_MESH_IP:?}
      COORDINATION_PRIMARY_IP: ${COORDINATION_PRIMARY_IP:?Initial primary Mesh IP}
    volumes:
      - coordination_data:/data
      - ./coordination/entrypoint.sh:/campus-coordination.sh:ro
    secrets: [cluster_redis]
    ports: ["${CLUSTER_MESH_IP:?}:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/cluster_redis) valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  sentinel:
    image: valkey/valkey:8.1.3@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    entrypoint: ["/bin/sh", "/campus-coordination.sh"]
    environment:
      COORDINATION_MODE: sentinel
      CLUSTER_MESH_IP: ${CLUSTER_MESH_IP:?}
      COORDINATION_PRIMARY_IP: ${COORDINATION_PRIMARY_IP:?}
    volumes:
      - sentinel_data:/data
      - ./coordination/entrypoint.sh:/campus-coordination.sh:ro
    secrets: [cluster_redis]
    ports: ["${CLUSTER_MESH_IP:?}:26379:26379"]
    restart: unless-stopped

volumes:
  coordination_data:
  sentinel_data:
secrets:
  cluster_redis:
    file: ${CLUSTER_REDIS_PASSWORD_FILE:?Protected matching hex secret on all three hosts}
