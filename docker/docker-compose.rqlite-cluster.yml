# Um node rqlite por host, com identidade e enderecos anunciados independentes.
# Use o mesmo arquivo no notebook e no Termux; somente rqlite.node.env muda.
#
#   cp docker/rqlite.leader.env.example docker/rqlite.node.env   # notebook
#   cp docker/rqlite.joined.env.example docker/rqlite.node.env   # Termux
#   docker compose --env-file docker/rqlite.node.env \
#     -f docker/docker-compose.rqlite-cluster.yml up -d --build
services:
  rqlite:
    build:
      context: ./rqlite
      args:
        RQLITE_VERSION: ${RQLITE_VERSION:-10.3.2}
    container_name: ${RQLITE_CONTAINER_NAME:-amca-rqlite-node}
    environment:
      RQLITE_NODE_ID: ${RQLITE_NODE_ID:-node-1}
      RQLITE_NODE_ROLE: ${RQLITE_NODE_ROLE:-leader}
      RQLITE_NETWORK_MODE: ${RQLITE_NETWORK_MODE:-tailscale}
      RQLITE_HTTP_BIND_ADDR: 0.0.0.0:4001
      RQLITE_RAFT_BIND_ADDR: 0.0.0.0:4002
      RQLITE_HTTP_ADV_ADDR: ${RQLITE_HTTP_ADV_ADDR:-}
      RQLITE_RAFT_ADV_ADDR: ${RQLITE_RAFT_ADV_ADDR:-}
      RQLITE_JOIN_ADDRS: ${RQLITE_JOIN_ADDRS:-}
      RQLITE_JOIN_AS: ${RQLITE_JOIN_AS:-}
      RQLITE_JOIN_ATTEMPTS: ${RQLITE_JOIN_ATTEMPTS:-20}
      RQLITE_JOIN_INTERVAL: ${RQLITE_JOIN_INTERVAL:-3s}
      RQLITE_HTTP_ALLOW_ORIGIN: ${RQLITE_HTTP_ALLOW_ORIGIN:-}
      RQLITE_AUTH_FILE: ${RQLITE_AUTH_FILE:-}
      RQLITE_HTTP_CERT: ${RQLITE_HTTP_CERT:-}
      RQLITE_HTTP_KEY: ${RQLITE_HTTP_KEY:-}
      RQLITE_HTTP_CA_CERT: ${RQLITE_HTTP_CA_CERT:-}
      RQLITE_HTTP_VERIFY_CLIENT: ${RQLITE_HTTP_VERIFY_CLIENT:-false}
      RQLITE_NODE_CERT: ${RQLITE_NODE_CERT:-}
      RQLITE_NODE_KEY: ${RQLITE_NODE_KEY:-}
      RQLITE_NODE_CA_CERT: ${RQLITE_NODE_CA_CERT:-}
      RQLITE_NODE_VERIFY_CLIENT: ${RQLITE_NODE_VERIFY_CLIENT:-false}
      RQLITE_NODE_NO_VERIFY: ${RQLITE_NODE_NO_VERIFY:-false}
      RQLITE_NODE_VERIFY_SERVER_NAME: ${RQLITE_NODE_VERIFY_SERVER_NAME:-}
      RQLITE_NODE_VERIFY_COMMON_NAME: ${RQLITE_NODE_VERIFY_COMMON_NAME:-}
      RQLITE_ALLOW_INSECURE_TUNNEL: ${RQLITE_ALLOW_INSECURE_TUNNEL:-false}
      RQLITE_COMPRESS_SNAPSHOT_TRANSPORT: ${RQLITE_COMPRESS_SNAPSHOT_TRANSPORT:-true}
    ports:
      # Em Docker Desktop + Tailscale no WSL, mantenha 127.0.0.1 e use
      # `tailscale serve --tcp` para publicar cada porta somente na tailnet.
      - "${RQLITE_PUBLISH_HOST:-127.0.0.1}:${RQLITE_HTTP_HOST_PORT:-8001}:4001"
      - "${RQLITE_PUBLISH_HOST:-127.0.0.1}:${RQLITE_RAFT_HOST_PORT:-4003}:4002"
    volumes:
      - rqlite_cluster_data:/rqlite/file
      - "${RQLITE_SECURITY_DIR:-./rqlite/security}:/run/rqlite-security:ro"
    restart: unless-stopped

volumes:
  rqlite_cluster_data:
